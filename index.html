<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziz Karagülmez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #f3f4f6;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #0f172a;
        }
        .hero-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #10b981;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-desc {
            font-size: 1.5rem;
            color: #d1d5db;
            margin-bottom: 2rem;
        }
        .hero-socials {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        .hero-socials a {
            color: #d1d5db;
            font-size: 2rem;
            transition: all 0.3s ease;
        }
        .hero-socials a:hover {
            color: #10b981;
            transform: translateY(-3px);
        }
        .nav-links {
            position: static;
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            z-index: 2;
        }
        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #10b981, #059669);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .nav-link:hover {
            color: #f3f4f6;
        }
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .hero-desc {
                font-size: 1.2rem;
            }
            .nav-links {
                gap: 1rem;
                flex-wrap: wrap;
            }
            .navbar {
                padding: 0.75rem;
            }
            
            .navbar nav ul {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .navbar nav ul li a {
                font-size: 0.9rem;
                padding: 0.3rem 0.7rem;
            }
            
            .hero-socials {
                gap: 1.5rem;
            }
            
            .hero-socials a {
                font-size: 1.5rem;
            }
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .navbar nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .navbar nav ul li a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
        }
        
        .navbar nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #10b981, #059669);
            transition: width 0.3s ease;
        }
        
        .navbar nav ul li a:hover::after,
        .navbar nav ul li a.active::after {
            width: 100%;
        }
        
        .navbar nav ul li a:hover {
            color: #f3f4f6;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <header class="navbar">
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>

                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="hero-content">
        <img src="profile.jpg" alt="Aziz Karagülmez" class="profile-img">

        <div class="hero-socials">

            <a href="https://www.linkedin.com/in/aziz-karag%C3%BClmez-612762199/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:azizkaragulmez07@gmail.com"><i class="fas fa-envelope"></i></a>
            <a href="https://instagram.com/krglmzzz" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
       
    </div>
