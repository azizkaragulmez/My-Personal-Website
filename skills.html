<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Aziz Karagülmez</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #f3f4f6;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .navbar nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .navbar nav ul li a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
        }
        
        .navbar nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #10b981, #059669);
            transition: width 0.3s ease;
        }
        
        .navbar nav ul li a:hover::after,
        .navbar nav ul li a.active::after {
            width: 100%;
        }
        
        .navbar nav ul li a:hover {
            color: #f3f4f6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            padding-top: 100px;
        }

        .skills-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            background: linear-gradient(to right, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .skills-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            padding: 1rem;
        }

        .skill-category {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }

        .skill-category:hover {
            transform: translateY(-5px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .category-title {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #10b981;
            text-align: center;
            position: relative;
            padding-bottom: 0.8rem;
        }

        .category-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: linear-gradient(to right, #10b981, #059669);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            justify-items: center;
        }

        .skill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 0.8rem;
            transition: all 0.3s ease;
            width: 90px;
            height: 90px;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .skill-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .skill-item:hover::before {
            opacity: 1;
        }

        .skill-item:hover {
            background: rgba(15, 23, 42, 0.6);
            transform: translateY(-5px) scale(1.05);
        }

        .skill-icon {
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }

        .skill-item:hover .skill-icon {
            transform: rotate(360deg);
        }

        .skill-name {
            font-size: 0.8rem;
            color: #d1d5db;
            text-align: center;
            margin-top: 0.3rem;
        }

        @media (max-width: 1200px) {
            .skills-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .skills-container {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                padding: 1rem;
            }
            
            .navbar nav ul {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .skill-item {
                width: 80px;
                height: 80px;
            }

            .skill-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html" class="active">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="skills-title">Technical Skills</h1>
        
        <div class="skills-container">
            <div class="skill-category">
                <h2 class="category-title">Programming Languages</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <i class="skill-icon devicon-java-plain colored"></i>
                        <span class="skill-name">Java</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-dart-plain colored"></i>
                        <span class="skill-name">Dart</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-javascript-plain colored"></i>
                        <span class="skill-name">JavaScript</span>
                    </div>
                    
                    
                </div>
            </div>

            <div class="skill-category">
                <h2 class="category-title">Frameworks & Libraries</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <i class="skill-icon devicon-flutter-plain colored"></i>
                        <span class="skill-name">Flutter</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-spring-plain colored"></i>
                        <span class="skill-name">Spring</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-react-original colored"></i>
                        <span class="skill-name">React Native</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-nodejs-plain colored"></i>
                        <span class="skill-name">Node.js</span>
                    </div>
                    
                </div>
            </div>

            <div class="skill-category">
                <h2 class="category-title">Databases</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <i class="skill-icon devicon-mysql-plain colored"></i>
                        <span class="skill-name">MySQL</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-mongodb-plain colored"></i>
                        <span class="skill-name">MongoDB</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-sqlite-plain colored"></i>
                        <span class="skill-name">SQLite</span>
                    </div>
                </div>
            </div>

            <div class="skill-category">
                <h2 class="category-title">Tools & Technologies</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <i class="skill-icon devicon-git-plain colored"></i>
                        <span class="skill-name">Git</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-github-original colored"></i>
                        <span class="skill-name">GitHub</span>
                    </div>
                    <div class="skill-item">
                        <i class="skill-icon devicon-docker-plain colored"></i>
                        <span class="skill-name">Docker</span>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </div>

    <script>
        const skillItems = document.querySelectorAll('.skill-item');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = 1;
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.5 });

        skillItems.forEach((item, index) => {
            item.style.opacity = 0;
            item.style.transform = 'translateY(20px)';
            item.style.transition = `all 0.5s ease ${index * 0.1}s`;
            observer.observe(item);
        });
    </script>
</body>
</html>
